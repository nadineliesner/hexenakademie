
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Hexenmeister-Akademie</title>

  <style>
    body {
      background: #241537;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 30px 15px;
    }

    h1 {
      color: #e4baff;
    }

    .karte {
      background: #45305f;
      border-radius: 20px;
      padding: 25px;
      margin: 25px auto;
      max-width: 400px;
    }

    button {
      background: #e4baff;
      border: none;
      border-radius: 12px;
      padding: 15px 20px;
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <h1>🪄 Hexenmeister-Akademie</h1>

  <p>Willkommen in deiner magischen Welt!</p>

  <div class="karte">
    <h2>🪥 Der Zahnputzzauber</h2>

    <p>
      Bist du bereit für deine erste
      magische Aufgabe?
    </p>

    <button onclick="zaubern()">
      ✨ Zauber starten
    </button>
  </div>

  <script>
    function zaubern() {
      alert(
        "Zauberhaft! " +
        "Deine Zahnputzmission beginnt!"
      );
    }
  </script>
</body>
</html>
